'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),keyName='advanced-notes-vault';
let data={notes:[],folders:[]},id=null,view='all',folderView='',tagView='',markdown=false,preview=false,dirty=false,timer=0,cryptoKey=null,encrypted=false,unlocked=true;
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),date=()=>new Date().toISOString(),current=()=>data.notes.find(n=>n.id===id),escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2400)}
const enc=s=>new TextEncoder().encode(s),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){let k=await crypto.subtle.importKey('raw',enc(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

function load(){let v=JSON.parse(localStorage.getItem(keyName)||'null');if(!v)return;if(v.encrypted){encrypted=true;unlocked=false;$('#modal').innerHTML='<div class="modal"><form class="card" id="unlockForm"><h2>Unlock your notes</h2><p>Your notes are encrypted on this device.</p><input id="pass" type="password" placeholder="Workspace password" required><button class="primary">Unlock</button><p id="err" class="danger"></p></form></div>';$('#unlockForm').onsubmit=async e=>{e.preventDefault();try{let salt=un64(v.salt),k=await derive($('#pass').value,salt),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(v.iv)},k,un64(v.data));data=JSON.parse(new TextDecoder().decode(plain));cryptoKey=k;unlocked=true;$('#modal').innerHTML='';render();}catch(x){$('#err').textContent='Incorrect password or damaged vault.'}}}else data=JSON.parse(v.data||'{"notes":[],"folders":[]}')}
function sanitizeHtml(input){const doc=new DOMParser().parseFromString(String(input||''),'text/html');const allowed=new Set(['P','BR','DIV','SPAN','B','STRONG','I','EM','U','S','H1','H2','H3','H4','UL','OL','LI','BLOCKQUOTE','PRE','CODE','A','TABLE','THEAD','TBODY','TR','TH','TD','HR','INPUT']);const walk=node=>{[...node.childNodes].forEach(child=>{if(child.nodeType===1){if(!allowed.has(child.tagName)){walk(child);child.replaceWith(...child.childNodes);return}for(const a of [...child.attributes]){const ok=(child.tagName==='A'&&a.name==='href'&&/^https?:\/\//i.test(a.value))||(child.tagName==='INPUT'&&a.name==='type'&&a.value==='checkbox');if(!ok)child.removeAttribute(a.name)}if(child.tagName==='INPUT'){child.disabled=true;child.setAttribute('aria-label','Checklist item')}walk(child)}else if(child.nodeType!==3)child.remove()})};walk(doc.body);return doc.body.innerHTML}
function text(n){let d=document.createElement('div');d.innerHTML=sanitizeHtml(n.content||'');return d.textContent||''}
function render(){renderNav();let a=data.notes.filter(n=>{if(view==='trash')return n.deleted;if(n.deleted)return false;if(view==='archive')return n.archived;if(n.archived)return false;if(view==='favorites')return n.favorite;if(view==='pinned')return !!n.pinned;if(view==='due'){if(!n.due)return false;const limit=new Date(Date.now()+7*86400000).toISOString().slice(0,10);return n.due<=limit}if(view==='recent')return true;if(folderView)return n.folder===folderView;if(tagView)return(n.tags||[]).includes(tagView);return true});let q=$('#search').value.toLowerCase();if(q)a=a.filter(n=>(n.title+' '+text(n)+' '+(n.tags||[]).join(' ')).toLowerCase().includes(q));let sort=$('#sort').value;a.sort((x,y)=>sort==='title'?x.title.localeCompare(y.title):sort==='created'?y.created.localeCompare(x.created):y.updated.localeCompare(x.updated));$('#items').innerHTML=a.length?a.map(n=>'<button class="note '+(n.id===id?'active':'')+'" data-id="'+escape(n.id)+'"><div class="nt">'+escape(n.title||'Untitled note')+'</div><div class="preview">'+escape(text(n).slice(0,100)||'No additional text')+'</div><div class="meta">'+(n.favorite?'★ ':'')+escape((n.tags||[]).join(', '))+' · '+new Date(n.updated).toLocaleDateString()+'</div></button>').join(''):'<div class="empty">No notes here. Create a note or change your search.</div>';$('#listTitle').textContent=({all:'All notes',favorites:'Favorites',recent:'Recently edited',pinned:'Pinned notes',due:'Due soon',archive:'Archive',trash:'Recycle bin'}[view]||'Folder');$('#count').textContent=data.notes.filter(n=>!n.deleted).length+' notes';$('#storage').textContent=encrypted?'Encrypted on this device':'Stored on this device';renderEditor()}
function renderNav(){let tags=[...new Set(data.notes.filter(n=>!n.deleted).flatMap(n=>n.tags||[]))].sort();const rows=[];const add=(parent,depth,seen)=>data.folders.filter(f=>(f.parentId||'')===parent&&!seen.has(f.id)).forEach(f=>{const next=new Set(seen);next.add(f.id);rows.push('<button data-folder="'+escape(f.id)+'" style="padding-left:'+(8+depth*14)+'px">▰ '+escape(f.name)+'</button>');add(f.id,depth+1,next)});add('',0,new Set());$('#folders').innerHTML=rows.join('');$('#tags').innerHTML=tags.map(t=>'<button data-tag="'+escape(t)+'"># '+escape(t)+'</button>').join('');const opts=[];const option=(parent,depth,seen)=>data.folders.filter(f=>(f.parentId||'')===parent&&!seen.has(f.id)).forEach(f=>{const next=new Set(seen);next.add(f.id);opts.push('<option value="'+escape(f.id)+'">'+('　'.repeat(depth))+escape(f.name)+'</option>');option(f.id,depth+1,next)});option('',0,new Set());$('#folder').innerHTML='<option value="">None</option>'+opts.join('')}
function renderEditor(){let n=current();['#title','#rich','#md','#folder','#noteTags','#favorite','#archive','#delete','#restore','#markdown','#preview','#pin'].forEach(s=>$(s).disabled=!n);$('#restore').disabled=!n||!n.deleted;$('#pin').textContent=n&&n.pinned?'Unpin':'Pin';if(!n){$('#title').value='';$('#rich').innerHTML='';$('#md').value='';$('#noteTags').value='';$('#saved').textContent='Select or create a note';counts('');return}$('#title').value=n.title;$('#rich').innerHTML=sanitizeHtml(n.content||'');$('#md').value=n.markdown||'';$('#noteTags').value=(n.tags||[]).join(', ');$('#folder').value=n.folder||'';$('#favorite').textContent=n.favorite?'★':'☆';$('#archive').textContent=n.archived?'Unarchive':'Archive';$('#saved').textContent='Saved '+new Date(n.updated).toLocaleString();markdown=!!n.markdownMode;preview=false;sync();counts(text(n))}
function counts(t){$('#words').textContent=(t.trim()?t.trim().split(/\s+/).length:0)+' words';$('#chars').textContent=t.length+' characters'}
function sync(){$('#rich').classList.toggle('hidden',markdown||preview);$('#md').style.display=markdown&&!preview?'block':'none';$('#previewPane').classList.toggle('hidden',!preview);$('#preview').textContent=preview?'Edit':'Preview'}
function mdHtml(s){return '<p>'+escape(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')+'</p>'}
function toMd(h){let d=document.createElement('div');d.innerHTML=h;return d.innerText}
function schedule(){if(!current())return;dirty=true;$('#saved').textContent='Saving…';clearTimeout(timer);timer=setTimeout(saveNote,400)}
async function saveNote(){let n=current();if(!n||!dirty)return;n.title=$('#title').value.trim()||'Untitled note';n.folder=$('#folder').value||'';n.tags=$('#noteTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20);if(markdown){n.markdown=$('#md').value;n.content=mdHtml(n.markdown);n.markdownMode=true}else{n.content=sanitizeHtml($('#rich').innerHTML);n.markdown='';n.markdownMode=false}n.updated=date();n.history=n.history||[];n.history.push({title:n.title,content:n.content,updated:n.updated});n.history=n.history.slice(-20);dirty=false;await save();render();$('#saved').textContent='Saved'}
function create(){let n={id:uid(),title:'',content:'',markdown:'',markdownMode:false,folder:folderView||'',tags:[],favorite:false,archived:false,deleted:false,created:date(),updated:date(),history:[]};data.notes.unshift(n);id=n.id;save().then(()=>{render();$('#title').focus()})}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){saveNote().then(()=>download(new Blob([JSON.stringify({format:'AdvancedNotesBackup',vault:localStorage.getItem(keyName),salt:localStorage.getItem(keyName+'_salt')})],{type:'application/json'}),'advanced-notes-backup.json'))}
function ask(title,body,cb){$('#modal').innerHTML='<div class="modal"><form class="card"><h2>'+title+'</h2><p>'+body+'</p><input id="askValue" required><button class="primary">Continue</button> <button type="button" id="cancel">Cancel</button></form></div>';$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#modal').querySelector('form').onsubmit=e=>{e.preventDefault();let v=$('#askValue').value;$('#modal').innerHTML='';cb(v)}}
$('#new').onclick=create;$('#folderAdd').onclick=()=>ask('New folder','Enter a folder name',async name=>{data.folders.push({id:uid(),name:name.slice(0,60),parentId:folderView||''});await save();render()});$('#folders').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-folder]');if(!b)return;e.preventDefault();const f=data.folders.find(x=>x.id===b.dataset.folder);if(!f)return;const action=prompt('Folder actions: child, rename, delete','child');if(action==='child'){const name=prompt('Name of subfolder');if(name){data.folders.push({id:uid(),name:name.slice(0,60),parentId:f.id});save().then(render)}}else if(action==='rename'){const name=prompt('New folder name',f.name);if(name){f.name=name.slice(0,60);save().then(render)}}else if(action==='delete'&&confirm('Delete this folder? Notes and subfolders will move to its parent.')){data.folders.forEach(x=>{if(x.parentId===f.id)x.parentId=f.parentId||''});data.notes.forEach(n=>{if(n.folder===f.id)n.folder=f.parentId||''});data.folders=data.folders.filter(x=>x.id!==f.id);if(folderView===f.id)folderView=f.parentId||'';save().then(render)}});$('#search').oninput=render;$('#sort').onchange=render;
$('#items').onclick=e=>{let b=e.target.closest('[data-id]');if(b){saveNote().then(()=>{id=b.dataset.id;render()})}};
$('.nav').onclick=e=>{let v=e.target.closest('[data-view]'),f=e.target.closest('[data-folder]'),t=e.target.closest('[data-tag]');if(v){view=v.dataset.view;folderView='';tagView='';id=null;$$('[data-view]').forEach(x=>x.classList.toggle('active',x===v));render()}if(f){folderView=f.dataset.folder;tagView='';view='all';id=null;render()}if(t){tagView=t.dataset.tag;folderView='';view='all';id=null;render()}};
$('#title').oninput=schedule;$('#rich').oninput=()=>{schedule();counts($('#rich').innerText)};$('#md').oninput=()=>{schedule();counts($('#md').value)};$('#folder').onchange=schedule;$('#noteTags').oninput=schedule;
$$('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('#rich').focus();schedule()});
$('#markdown').onclick=()=>{if(!current())return;if(!markdown)$('#md').value=toMd($('#rich').innerHTML);else $('#rich').innerHTML=mdHtml($('#md').value);markdown=!markdown;preview=false;sync();schedule()};
$('#preview').onclick=()=>{if(!current())return;if(!preview)$('#previewPane').innerHTML=sanitizeHtml(mdHtml(markdown?$('#md').value:toMd($('#rich').innerHTML)));preview=!preview;sync()};
$('#favorite').onclick=()=>{let n=current();if(n){n.favorite=!n.favorite;schedule();renderEditor()}};
$('#archive').onclick=()=>{let n=current();if(n){n.archived=!n.archived;schedule();render()}};
$('#restore').onclick=()=>{let n=current();if(!n||!n.deleted)return;n.deleted=false;n.updated=date();save().then(render);toast('Note restored')};$('#delete').onclick=()=>{let n=current();if(!n)return;if(n.deleted){if(confirm('Permanently delete this note?'))data.notes=data.notes.filter(x=>x!==n)}else n.deleted=true;id=null;save().then(render)};

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNote()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});

try{load();if(unlocked)render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){toast('Could not open notes: '+e.message)}

$('#daily').onclick=async()=>{const d=new Date().toISOString().slice(0,10);let n=data.notes.find(x=>x.dailyDate===d&&!x.deleted);if(!n){n={id:uid(),title:'Daily journal — '+d,content:'<h2>Today</h2><p></p><h2>Priorities</h2><ul><li></li></ul><h2>Notes</h2><p></p><h2>Gratitude</h2><p></p>',markdown:'',markdownMode:false,folder:'',tags:['journal'],favorite:false,archived:false,deleted:false,created:date(),updated:date(),history:[],dailyDate:d};data.notes.unshift(n);await save()}id=n.id;view='all';folderView='';tagView='';render();$('#title').focus();};
const renderBase=render;
render=function(){renderBase();const items=$('#items');const buttons=[...items.querySelectorAll('.note')];buttons.forEach(b=>{const n=data.notes.find(x=>x.id===b.dataset.id);if(!n)return;const flags=[];if(n.due)flags.push('Due '+n.due);if(n.pinned)flags.push('📌');if(n.dailyDate)flags.push('Journal');if(flags.length){const m=document.createElement('div');m.className='meta';m.textContent=flags.join(' · ');b.append(m)}});buttons.sort((a,b)=>Number(!!data.notes.find(n=>n.id===b.dataset.id)?.pinned)-Number(!!data.notes.find(n=>n.id===a.dataset.id)?.pinned));buttons.forEach(x=>items.append(x));};
$('#items').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-id]');if(!b)return;e.preventDefault();const n=data.notes.find(x=>x.id===b.dataset.id);if(!n)return;const action=prompt('Note actions: type pin, unpin, or delete','pin');if(action==='pin'||action==='unpin'){n.pinned=action==='pin';n.updated=date();save().then(render)}else if(action==='delete'){n.deleted=true;save().then(render)}});

<script>
(()=>{'use strict';
data.tasks=Array.isArray(data.tasks)?data.tasks:[];
const modal=$('#modal');
const safeDate=s=>{const d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?null:d};
const openModal=html=>{modal.innerHTML='<div class="modal"><div class="card" style="width:min(760px,100%);max-height:85vh;overflow:auto">'+html+'</div></div>';};
const closeModal=()=>{modal.innerHTML=''};
const esc=escape;
function taskDialog(){
 data.tasks=Array.isArray(data.tasks)?data.tasks:[];
 const rows=data.tasks.map((t,i)=>'<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-taskdone="'+i+'" '+(t.done?'checked':'')+'><span style="flex:1;'+(t.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(t.text)+'</span><small>'+esc(t.due||'No due date')+'</small><button data-taskedit="'+i+'">Edit</button><button data-taskdel="'+i+'">×</button></div>').join('');
 openModal('<h2>Task manager</h2><p class="muted">Track standalone tasks locally. Tasks are included in workspace backups.</p><form id="taskForm" style="display:flex;gap:6px;flex-wrap:wrap"><input id="taskText" placeholder="Add a task…" required style="flex:1;min-width:180px;padding:9px;border:1px solid var(--line)"><input id="taskDue" type="date" style="padding:8px;border:1px solid var(--line)"><button class="primary">Add task</button></form><div style="margin-top:12px">'+(rows||'<p class="empty">No tasks yet. Add one above.</p>')+'</div><p style="text-align:right"><button id="taskClose">Close</button></p>');
 $('#taskForm').onsubmit=async e=>{e.preventDefault();data.tasks.push({id:uid(),text:$('#taskText').value.trim(),due:$('#taskDue').value,done:false,created:date()});await save();taskDialog()};
 modal.querySelectorAll('[data-taskdone]').forEach(x=>x.onchange=async()=>{data.tasks[+x.dataset.taskdone].done=x.checked;await save();taskDialog()});
 modal.querySelectorAll('[data-taskdel]').forEach(x=>x.onclick=async()=>{data.tasks.splice(+x.dataset.taskdel,1);await save();taskDialog()});
 modal.querySelectorAll('[data-taskedit]').forEach(x=>x.onclick=async()=>{const t=data.tasks[+x.dataset.taskedit],v=prompt('Edit task',t.text);if(v!==null&&v.trim())t.text=v.trim();await save();taskDialog()});
 $('#taskClose').onclick=closeModal;
}
function calendarDialog(month=new Date()){
 const year=month.getFullYear(),mo=month.getMonth(),first=new Date(year,mo,1),start=new Date(year,mo,1-first.getDay()),days=[];
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const notes=data.notes.filter(n=>!n.deleted&&!n.archived&&(n.due===key||n.dailyDate===key));days.push('<div style="min-height:74px;border:1px solid var(--line);padding:5px;background:'+(d.getMonth()===mo?'white':'#eef1f4')+'"><small>'+d.getDate()+'</small>'+notes.map(n=>'<button data-calnote="'+esc(n.id)+'" style="display:block;width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:#dce8f3;margin-top:3px;padding:3px"> '+esc(n.title||'Untitled')+'</button>').join('')+'</div>')}
 openModal('<div style="display:flex;align-items:center;gap:8px"><button id="calPrev">‹</button><h2 style="flex:1;margin:0">'+month.toLocaleString(undefined,{month:'long',year:'numeric'})+'</h2><button id="calNext">›</button></div><p class="muted">Shows notes due on each date and daily journal entries. Select an entry to open it.</p><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<b style="text-align:center;padding:5px">'+x+'</b>').join('')+days.join('')+'</div><p style="text-align:right"><button id="calClose">Close</button></p>');
 $('#calPrev').onclick=()=>calendarDialog(new Date(year,mo-1,1));$('#calNext').onclick=()=>calendarDialog(new Date(year,mo+1,1));$('#calClose').onclick=closeModal;
 modal.querySelectorAll('[data-calnote]').forEach(b=>b.onclick=async()=>{await saveNote();id=b.dataset.calnote;view='all';folderView='';tagView='';closeModal();render();});
}
function historyDialog(){
 const n=current();if(!n)return toast('Select a note first');
 const hist=(n.history||[]).slice().reverse();
 if(!hist.length)return toast('No saved versions yet');
 const options=hist.map((h,i)=>'<option value="'+i+'">'+(i+1)+'. '+new Date(h.updated).toLocaleString()+' — '+esc(h.title||'Untitled')+'</option>').join('');
 openModal('<h2>Version history</h2><p class="muted">Up to 20 autosaved snapshots are kept per note on this device.</p><label>Choose a version</label><select id="histPick" style="width:100%;padding:8px;margin:6px 0">'+options+'</select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><section><b>Selected version</b><pre id="histSelected" style="white-space:pre-wrap;max-height:260px;overflow:auto;background:#eef1f4;padding:10px"></pre></section><section><b>Current note</b><pre id="histCurrent" style="white-space:pre-wrap;max-height:260px;overflow:auto;background:#eef1f4;padding:10px"></pre></section></div><p><button id="histRestore" class="primary">Restore selected version</button> <button id="histExport">Export selected version</button> <button id="histClose">Close</button></p>');
 const display=h=>h.title+'\n\n'+(new DOMParser().parseFromString(sanitizeHtml(h.content),'text/html').body.textContent||'');
 const update=()=>{$('#histSelected').textContent=display(hist[+$('#histPick').value]);$('#histCurrent').textContent=(n.title||'Untitled')+'\n\n'+text(n)};
 $('#histPick').onchange=update;update();
 $('#histRestore').onclick=async()=>{const h=hist[+$('#histPick').value];if(!confirm('Restore this snapshot? The current content will first be saved in history.'))return;n.history=n.history||[];n.history.push({title:n.title,content:n.content,updated:date()});n.title=h.title;n.content=h.content;n.markdown='';n.markdownMode=false;n.updated=date();await save();closeModal();render();toast('Version restored')};
 $('#histExport').onclick=()=>{const h=hist[+$('#histPick').value];download(new Blob([display(h)],{type:'text/plain;charset=utf-8'}),(h.title||'note')+'-version.txt')};
 $('#histClose').onclick=closeModal;
}
function improvedSettings(){
 const oldEncryption=()=>{if(encrypted)return toast('Encryption already enabled');ask('Set workspace password','Use at least 8 characters. Keep it safe; it cannot be recovered.',async pass=>{if(pass.length<8)return toast('Use at least 8 characters');let salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await derive(pass,salt);localStorage.setItem(keyName+'_salt',b64(salt));encrypted=true;await save();toast('Encryption enabled')})};
 openModal('<h2>Workspace settings</h2><p class="muted">All notes and tasks remain in this browser unless you export a backup.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="setEncrypt">Enable password encryption</button><button id="setHistory">Browse version history</button><button id="setTasks">Task manager</button><button id="setCalendar">Calendar</button><button id="setExport">Export current note (.md)</button><button id="setHtml">Export current note (.html)</button><button id="setImport">Import backup</button><button id="setClose">Close</button></div><p class="muted" style="margin-top:15px">Encryption uses AES-256-GCM with PBKDF2. A forgotten password cannot be recovered.</p>');
 $('#setEncrypt').onclick=oldEncryption;$('#setHistory').onclick=historyDialog;$('#setTasks').onclick=taskDialog;$('#setCalendar').onclick=calendarDialog;
 $('#setExport').onclick=()=>{const n=current();if(!n)return toast('Select a note first');download(new Blob([n.markdownMode?n.markdown:toMd(n.content)],{type:'text/markdown;charset=utf-8'}),(n.title||'note')+'.md')};
 $('#setHtml').onclick=()=>{const n=current();if(!n)return toast('Select a note first');const html='<!doctype html><meta charset="utf-8"><title>'+esc(n.title)+'</title><article><h1>'+esc(n.title)+'</h1>'+sanitizeHtml(n.content)+'</article>';download(new Blob([html],{type:'text/html;charset=utf-8'}),(n.title||'note')+'.html')};
 $('#setImport').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const raw=JSON.parse(await i.files[0].text());let stored;if(raw.format==='AdvancedNotesBackup'){if(typeof raw.vault!=='string')throw Error('Backup vault is missing');stored=JSON.parse(raw.vault);if(stored.encrypted){if(!stored.iv||!stored.data||!(raw.salt||stored.salt))throw Error('Encrypted backup metadata is incomplete')}else{const vault=JSON.parse(stored.data||'{}');if(!vault||!Array.isArray(vault.notes)||!Array.isArray(vault.folders))throw Error('Backup structure is not valid');if(vault.notes.some(n=>!n||typeof n.id!=='string'||typeof n.title!=='string'||typeof n.content!=='string'))throw Error('One or more notes have invalid fields')}}else{const vault=raw;if(!vault||typeof vault!=='object'||!Array.isArray(vault.notes)||!Array.isArray(vault.folders))throw Error('Backup structure is not valid');if(vault.notes.some(n=>!n||typeof n.id!=='string'||typeof n.title!=='string'||typeof n.content!=='string'))throw Error('One or more notes have invalid fields');stored={encrypted:false,data:JSON.stringify(vault)}}if(!confirm('Replace the current workspace with this backup? Export a backup first if needed.'))return;if(raw.format==='AdvancedNotesBackup'&&raw.salt)localStorage.setItem(keyName+'_salt',raw.salt);localStorage.setItem(keyName,JSON.stringify(stored));location.reload()}catch(err){toast('Import failed: '+err.message)}};i.click()};
 $('#setClose').onclick=closeModal;
}
$('#settings').onclick=improvedSettings;
$('#daily').insertAdjacentHTML('afterend','<button id="calendarBtn">Calendar</button><button id="tasksBtn">Tasks</button>');
$('#calendarBtn').onclick=()=>calendarDialog();$('#tasksBtn').onclick=taskDialog;
const oldBackup=backup;
backup=async()=>{await saveNote();const vault=localStorage.getItem(keyName);download(new Blob([JSON.stringify({format:'AdvancedNotesBackup',vault,salt:localStorage.getItem(keyName+'_salt')})],{type:'application/json'}),'advanced-notes-backup.json');localStorage.setItem('advanced-notes-last-backup',date());toast('Backup exported')};$('#backup').onclick=backup;
const last=localStorage.getItem('advanced-notes-last-backup');
if(!last||Date.now()-new Date(last).getTime()>7*86400000){setTimeout(()=>{if(unlocked)toast('Backup reminder: export a backup to protect your notes')},1800)}
// Persist task-manager state and ensure a newly created vault has the task collection.
if(unlocked&&!Array.isArray(data.tasks)){data.tasks=[];save();}
})();
</script>


<script>
(()=>{'use strict';
data.savedSearches=Array.isArray(data.savedSearches)?data.savedSearches:[];
const searchInput=$('#search'),savedHost=document.createElement('div');
savedHost.id='savedSearches';
$('#tags').insertAdjacentHTML('afterend','<div class="heading">Saved searches</div>');
$('#tags').after(savedHost);
$('#sort').insertAdjacentHTML('afterend','<button id="saveSearch" class="tool" style="margin:5px 0;width:100%">＋ Save this search</button>');
$('#daily').insertAdjacentHTML('afterend','<button id="quickCapture">Quick capture</button><button id="statsBtn">Statistics</button>');
function renderSavedSearches(){
 savedHost.innerHTML=data.savedSearches.map((s,i)=>'<div style="display:flex;gap:3px;align-items:center"><button data-saved-search="'+i+'" style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;padding:6px">⌕ '+escape(s.name)+'</button><button data-remove-search="'+i+'" title="Remove saved search" style="border:0;background:transparent;padding:5px">×</button></div>').join('')||'<small class="muted">No saved searches</small>';
}
const baseRenderNav=renderNav;
renderNav=function(){baseRenderNav();renderSavedSearches()};
$('#saveSearch').onclick=async()=>{
 const q=searchInput.value.trim();
 if(!q)return toast('Enter a search term first');
 const name=prompt('Name this saved search',q);
 if(!name||!name.trim())return;
 const existing=data.savedSearches.findIndex(s=>s.query.toLowerCase()===q.toLowerCase());
 const entry={name:name.trim().slice(0,60),query:q};
 if(existing>=0)data.savedSearches[existing]=entry;else data.savedSearches.push(entry);
 data.savedSearches=data.savedSearches.slice(-30);
 await save();renderSavedSearches();toast('Search saved');
};
savedHost.addEventListener('click',async e=>{
 const b=e.target.closest('[data-saved-search]'),r=e.target.closest('[data-remove-search]');
 if(r){data.savedSearches.splice(+r.dataset.removeSearch,1);await save();renderSavedSearches();return}
 if(b){searchInput.value=data.savedSearches[+b.dataset.savedSearch]?.query||'';render();searchInput.focus()}
});
function quickCapture(){
 $('#modal').innerHTML='<div class="modal"><form class="card" id="quickForm"><h2>Quick capture</h2><p class="muted">Capture an idea without leaving your current note.</p><label for="quickTitle">Title</label><input id="quickTitle" maxlength="180" placeholder="A thought to remember"><label for="quickBody">Note</label><textarea id="quickBody" rows="5" placeholder="Write a quick thought…" style="width:100%;padding:9px;border:1px solid var(--line);margin:8px 0"></textarea><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" id="quickCancel">Cancel</button><button type="submit" class="primary">Save capture</button></div></form></div>';
 $('#quickCancel').onclick=()=>$('#modal').innerHTML='';
 $('#quickForm').onsubmit=async e=>{
  e.preventDefault();await saveNote();
  const title=$('#quickTitle').value.trim()||'Quick capture — '+new Date().toLocaleString();
  const content=sanitizeHtml('<p>'+escape($('#quickBody').value).replace(/\n/g,'<br>')+'</p>');
  const n={id:uid(),title,content,markdown:'',markdownMode:false,folder:folderView||'',tags:['quick-capture'],favorite:false,archived:false,deleted:false,created:date(),updated:date(),history:[]};
  data.notes.unshift(n);id=n.id;view='all';folderView='';tagView='';
  await save();$('#modal').innerHTML='';render();$('#title').focus();toast('Quick capture saved');
 };
 $('#quickTitle').focus();
}
$('#quickCapture').onclick=quickCapture;
function showStats(){
 const active=data.notes.filter(n=>!n.deleted&&!n.archived),words=active.reduce((sum,n)=>sum+text(n).trim().split(/\s+/).filter(Boolean).length,0);
 const tags=new Set(active.flatMap(n=>n.tags||[]));
 const done=(data.tasks||[]).filter(t=>t.done).length,total=(data.tasks||[]).length;
 const oldest=active.reduce((v,n)=>!v||n.created<v?n.created:v,'');
 const newest=active.reduce((v,n)=>!v||n.updated>v?n.updated:v,'');
 $('#modal').innerHTML='<div class="modal"><div class="card" style="width:min(620px,100%)"><h2>Workspace statistics</h2><p class="muted">Calculated locally from this browser. No data is uploaded.</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px">'+[
 ['Active notes',active.length],['Archived',data.notes.filter(n=>n.archived&&!n.deleted).length],['In recycle bin',data.notes.filter(n=>n.deleted).length],['Total words',words.toLocaleString()],['Folders',data.folders.length],['Unique tags',tags.size],['Tasks completed',done+' / '+total],['Saved searches',data.savedSearches.length]
 ].map(x=>'<div style="padding:12px;background:#edf2f6;border:1px solid var(--line);border-radius:5px"><small class="muted">'+x[0]+'</small><div style="font-size:22px;font-weight:700">'+x[1]+'</div></div>').join('')+'</div><p class="muted">Oldest note: '+(oldest?new Date(oldest).toLocaleDateString():'—')+' · Latest activity: '+(newest?new Date(newest).toLocaleDateString():'—')+'</p><p style="text-align:right"><button id="statsClose">Close</button></p></div></div>';
 $('#statsClose').onclick=()=>$('#modal').innerHTML='';
}
$('#statsBtn').onclick=showStats;
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();quickCapture()}
});
renderSavedSearches();
})();
</script>


<script>
(()=>{
 'use strict';
 const style=document.createElement('style');
 style.textContent='.focus-mode main{grid-template-columns:minmax(0,1fr)}.focus-mode .nav,.focus-mode .list{display:none}.focus-mode .editor{max-width:980px;width:100%;margin:0 auto;box-shadow:0 0 0 1px var(--line)}.focus-mode #app{grid-template-rows:42px 1fr 24px}.related{padding:8px 20px;border-bottom:1px solid #edf0f3;background:#fbfcfd;font-size:12px}.related button{margin:2px 4px 2px 0;border:1px solid var(--line);background:white;border-radius:4px;padding:4px 7px}.template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.template-grid button{text-align:left;padding:12px;border:1px solid var(--line);background:white;border-radius:5px}.template-grid button small{display:block;color:#657384;margin-top:4px}@media(max-width:760px){.focus-mode main{grid-template-rows:minmax(300px,1fr)}.focus-mode .editor{max-width:none}.related{padding:7px 12px}}';
 document.head.append(style);
 const toolbar=$('.toolbar');
 toolbar.insertAdjacentHTML('beforeend','<button class="tool" id="templatesBtn" title="Create from a template">Templates</button><button class="tool" id="linkNoteBtn" title="Link another note">Link note</button><button class="tool" id="focusBtn" title="Toggle distraction-free editor">Focus</button>');
 $('.sub').insertAdjacentHTML('afterend','<div class="related hidden" id="relatedNotes" aria-live="polite"></div>');
 function relatedRender(){
  const host=$('#relatedNotes'),n=current();
  if(!n){host.classList.add('hidden');host.innerHTML='';return}
  const links=Array.isArray(n.relatedNotes)?n.relatedNotes:[];
  const targets=links.map(x=>data.notes.find(y=>y.id===x&&!y.deleted)).filter(Boolean);
  const backlinks=data.notes.filter(x=>!x.deleted&&x.id!==n.id&&(x.relatedNotes||[]).includes(n.id));
  const all=[...targets.map(x=>({n:x,label:'Linked: '})),...backlinks.map(x=>({n:x,label:'Backlink: '}))];
  host.classList.remove('hidden');
  host.innerHTML='<b>Related notes</b> '+(all.length?all.map(x=>'<button data-open-related="'+escape(x.n.id)+'">'+x.label+escape(x.n.title||'Untitled')+'</button>').join(''):'<span class="muted">No links yet</span>');
 }
 const originalRenderEditor=renderEditor;
 renderEditor=function(){originalRenderEditor();relatedRender()};
 function createFromTemplate(kind){
  const templates={
   blank:{title:'Untitled note',content:''},
   meeting:{title:'Meeting notes — '+new Date().toLocaleDateString(),content:'<h2>Meeting details</h2><p><b>Date:</b> '+new Date().toLocaleDateString()+'</p><p><b>Attendees:</b></p><ul><li></li></ul><h2>Agenda</h2><ul><li></li></ul><h2>Discussion</h2><p></p><h2>Decisions</h2><ul><li></li></ul><h2>Action items</h2><ul data-task-list><li><input type="checkbox"> </li></ul>'},
   project:{title:'Project plan',content:'<h2>Objective</h2><p></p><h2>Scope</h2><ul><li></li></ul><h2>Milestones</h2><table><tbody><tr><th>Milestone</th><th>Target date</th><th>Status</th></tr><tr><td></td><td></td><td>Not started</td></tr></tbody></table><h2>Risks and blockers</h2><p></p><h2>Next actions</h2><ul><li></li></ul>'},
   study:{title:'Study notes',content:'<h2>Topic</h2><p></p><h2>Key concepts</h2><ul><li></li></ul><h2>Examples</h2><p></p><h2>Questions to revisit</h2><ul><li></li></ul><h2>Summary</h2><p></p>'},
   journal:{title:'Daily journal — '+new Date().toLocaleDateString(),content:'<h2>Today</h2><p></p><h2>What went well?</h2><p></p><h2>What could improve?</h2><p></p><h2>Tomorrow</h2><ul><li></li></ul>'},
   decision:{title:'Decision record',content:'<h2>Context</h2><p></p><h2>Options considered</h2><ul><li></li></ul><h2>Decision</h2><p></p><h2>Reasoning</h2><p></p><h2>Consequences</h2><p></p>'}
  };
  const t=templates[kind];if(!t)return;
  const n={id:uid(),title:t.title,content:sanitizeHtml(t.content),markdown:'',markdownMode:false,folder:folderView||'',tags:[],favorite:false,archived:false,deleted:false,created:date(),updated:date(),history:[],relatedNotes:[]};
  data.notes.unshift(n);id=n.id;view='all';folderView='';tagView='';
  save().then(()=>{render();$('#rich').focus();toast('Template note created')});
 }
 $('#templatesBtn').onclick=()=>{
  $('#modal').innerHTML='<div class="modal"><div class="card" style="width:min(560px,100%)"><h2>New note from template</h2><p class="muted">Start with a ready-made structure. Everything stays on this device.</p><div class="template-grid">'+[
   ['meeting','Meeting notes','Agenda, decisions and action items'],['project','Project plan','Milestones, scope and risks'],['study','Study notes','Concepts, examples and summary'],['journal','Daily journal','Reflection and tomorrow’s plan'],['decision','Decision record','Context, options and consequences'],['blank','Blank note','Start with an empty page']
  ].map(x=>'<button data-template="'+x[0]+'"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')+'</div><p style="text-align:right"><button id="templateClose">Cancel</button></p></div></div>';
  $('#templateClose').onclick=()=>$('#modal').innerHTML='';
  $('#modal').querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{const kind=b.dataset.template;$('#modal').innerHTML='';createFromTemplate(kind)});
 };
 $('#linkNoteBtn').onclick=()=>{
  const n=current();if(!n)return toast('Select a note first');
  const candidates=data.notes.filter(x=>!x.deleted&&!x.archived&&x.id!==n.id);
  $('#modal').innerHTML='<div class="modal"><div class="card" style="width:min(560px,100%)"><h2>Link a related note</h2><input id="relatedSearch" placeholder="Filter notes…" style="width:100%;padding:9px;border:1px solid var(--line)"><div id="relatedChoices" style="max-height:45vh;overflow:auto;margin-top:8px"></div><p style="text-align:right"><button id="relatedClose">Close</button></p></div></div>';
  const draw=()=>{$('#relatedChoices').innerHTML=candidates.filter(x=>(x.title+' '+text(x)).toLowerCase().includes($('#relatedSearch').value.toLowerCase())).map(x=>'<label style="display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)"><input type="checkbox" data-link-choice="'+escape(x.id)+'" '+((n.relatedNotes||[]).includes(x.id)?'checked':'')+'><span>'+escape(x.title||'Untitled note')+'</span></label>').join('')||'<p class="empty">No matching notes</p>'};
  $('#relatedSearch').oninput=draw;draw();
  $('#relatedChoices').onchange=async e=>{const b=e.target.closest('[data-link-choice]');if(!b)return;n.relatedNotes=Array.isArray(n.relatedNotes)?n.relatedNotes:[];if(b.checked&&!n.relatedNotes.includes(b.dataset.linkChoice))n.relatedNotes.push(b.dataset.linkChoice);if(!b.checked)n.relatedNotes=n.relatedNotes.filter(x=>x!==b.dataset.linkChoice);await save();relatedRender()};
  $('#relatedClose').onclick=()=>$('#modal').innerHTML='';
 };
 $('#relatedNotes').addEventListener('click',async e=>{const b=e.target.closest('[data-open-related]');if(!b)return;await saveNote();id=b.dataset.openRelated;view='all';folderView='';tagView='';$('#modal').innerHTML='';render()});
 $('#focusBtn').onclick=()=>{document.body.classList.toggle('focus-mode');$('#focusBtn').textContent=document.body.classList.contains('focus-mode')?'Exit focus':'Focus'};
 document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('#focusBtn').click()}
  if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='l'){e.preventDefault();$('#linkNoteBtn').click()}
 });
})();
</script>

<script>
(()=>{'use strict';
 data.snippets=Array.isArray(data.snippets)?data.snippets:[];
 const codeStyle=document.createElement('style');
 codeStyle.textContent='.code-library{width:min(980px,100%);max-height:92vh;overflow:auto}.code-layout{display:grid;grid-template-columns:minmax(180px, .8fr) minmax(0,1.7fr);gap:12px}.code-list{max-height:58vh;overflow:auto;border:1px solid var(--line);background:white}.code-item{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--line);background:white}.code-item:hover,.code-item.active{background:#e7eff7}.code-editor{min-width:0}.code-editor input,.code-editor select,.code-editor textarea,.code-search{width:100%;padding:9px;border:1px solid var(--line);border-radius:4px;margin:4px 0 9px;background:white}.code-editor textarea{min-height:42vh;resize:vertical;font:13px/1.55 Consolas,Monaco,monospace;tab-size:2;white-space:pre;overflow:auto}.code-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.code-actions button{padding:7px 10px;border:1px solid var(--line);background:white;border-radius:4px}.code-actions .primary{background:var(--blue);color:white}.code-meta{font-size:11px;color:#657384}@media(max-width:650px){.code-layout{grid-template-columns:1fr}.code-list{max-height:22vh}.code-editor textarea{min-height:34vh}}';
 document.head.append(codeStyle);
 const nav=$('.nav');
 nav.querySelector('[data-view="all"]').insertAdjacentHTML('afterend','<button id="codeLibraryNav">⌘ Code snippets</button>');
 $('.bar').insertAdjacentHTML('beforeend','<button id="codeLibraryBtn" title="Save and manage code snippets">Code snippets</button>');
 let activeSnippet=null;
 const languages=['Plain text','JavaScript','TypeScript','HTML','CSS','JSON','Python','Java','C','C++','C#','PHP','SQL','Bash','PowerShell','Markdown','YAML','XML','Go','Rust','Ruby','Kotlin','Swift','Dart','Other'];
 const extMap={'JavaScript':'js','TypeScript':'ts','HTML':'html','CSS':'css','JSON':'json','Python':'py','Java':'java','C':'c','C++':'cpp','C#':'cs','PHP':'php','SQL':'sql','Bash':'sh','PowerShell':'ps1','Markdown':'md','YAML':'yml','XML':'xml','Go':'go','Rust':'rs','Ruby':'rb','Kotlin':'kt','Swift':'swift','Dart':'dart'};
 const fileSafe=s=>(String(s||'code').trim().replace(/[^a-z0-9._-]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,70)||'code');
 const languageOptions=()=>languages.map(x=>'<option value="'+escape(x)+'">'+escape(x)+'</option>').join('');
 const openLibrary=async()=>{await saveNote();drawLibrary();};
 function drawLibrary(selected){
  const host=$('#modal');
  host.innerHTML='<div class="modal"><section class="card code-library"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div><h2>Code snippet library</h2><p class="muted">Save source code locally, in any language. Included in your encrypted vault and backups.</p></div><span class="grow"></span><button id="codeClose">Close</button></div><div class="code-layout"><section><input class="code-search" id="codeSearch" type="search" placeholder="Search snippets…"><div class="code-actions"><button class="primary" id="codeNew">＋ New snippet</button><button id="codeExportAll">Export library</button><button id="codeImportAll">Import library</button><input id="codeImportFile" type="file" accept=".json,application/json" hidden></div><div class="code-list" id="codeList"></div></section><section class="code-editor"><form id="codeForm"><label>Snippet name</label><input id="snippetTitle" maxlength="180" required placeholder="e.g. Fetch API helper"><label>Language</label><select id="snippetLanguage">'+languageOptions()+'</select><label>Tags (comma separated)</label><input id="snippetTags" maxlength="300" placeholder="javascript, api, utility"><label>Code</label><textarea id="snippetSource" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="// Paste or write your code here…" required></textarea><div class="code-meta" id="snippetInfo">0 lines · 0 characters</div><div class="code-actions"><button class="primary" type="submit">Save snippet</button><button type="button" id="snippetCopy">Copy code</button><button type="button" id="snippetDownload">Download file</button><button type="button" id="snippetDelete" class="danger">Delete</button></div></form></section></div></section></div>';
  $('#codeClose').onclick=()=>host.innerHTML='';
  const list=$('#codeList');
  const fill=(s)=>{activeSnippet=s?s.id:null;$('#snippetTitle').value=s?s.title:'';$('#snippetLanguage').value=s&&languages.includes(s.language)?s.language:'Other';$('#snippetTags').value=s?(s.tags||[]).join(', '):'';$('#snippetSource').value=s?s.code:'';$('#snippetDelete').disabled=!s;$('#snippetCopy').disabled=!s;$('#snippetDownload').disabled=!s;$('#snippetInfo').textContent=s?((s.code.match(/\n/g)||[]).length+1)+' lines · '+s.code.length+' characters':'New snippet · code is saved only when you press Save');list.querySelectorAll('.code-item').forEach(b=>b.classList.toggle('active',b.dataset.snippet===activeSnippet));};
  const drawList=()=>{const q=$('#codeSearch').value.trim().toLowerCase();const rows=data.snippets.filter(s=>(s.title+' '+s.language+' '+s.code+' '+(s.tags||[]).join(' ')).toLowerCase().includes(q)).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));list.innerHTML=rows.map(s=>'<button type="button" class="code-item '+(s.id===activeSnippet?'active':'')+'" data-snippet="'+escape(s.id)+'"><b>'+escape(s.title)+'</b><div class="code-meta">'+escape(s.language||'Plain text')+' · '+escape((s.tags||[]).join(', '))+'</div><div class="code-meta">'+escape(s.code.slice(0,90).replace(/\s+/g,' '))+'</div></button>').join('')||'<div class="empty">No snippets found. Create your first code snippet.</div>';list.querySelectorAll('[data-snippet]').forEach(b=>b.onclick=()=>fill(data.snippets.find(s=>s.id===b.dataset.snippet)));};
  $('#codeSearch').oninput=drawList;
  $('#codeNew').onclick=()=>fill(null);
  $('#snippetSource').oninput=()=>{$('#snippetInfo').textContent=(($('#snippetSource').value.match(/\n/g)||[]).length+1)+' lines · '+$('#snippetSource').value.length+' characters · unsaved changes'};
  $('#codeForm').onsubmit=async e=>{e.preventDefault();const source=$('#snippetSource').value;let s=data.snippets.find(x=>x.id===activeSnippet);if(!s){s={id:uid(),created:date()};data.snippets.unshift(s)}s.title=$('#snippetTitle').value.trim();s.language=$('#snippetLanguage').value;s.tags=$('#snippetTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,30);s.code=source;s.updated=date();await save();activeSnippet=s.id;drawList();fill(s);toast('Code snippet saved locally');};
  $('#snippetCopy').onclick=async()=>{if(!activeSnippet)return;try{await navigator.clipboard.writeText($('#snippetSource').value);toast('Code copied')}catch(e){$('#snippetSource').select();try{document.execCommand('copy');toast('Code copied')}catch(x){toast('Select the code and copy it manually')}}};
  $('#snippetDownload').onclick=()=>{const s=data.snippets.find(x=>x.id===activeSnippet);if(!s)return;const language=$('#snippetLanguage').value;download(new Blob([$('#snippetSource').value],{type:'text/plain;charset=utf-8'}),fileSafe($('#snippetTitle').value)+'.'+(extMap[language]||'txt'));};
  $('#snippetDelete').onclick=async()=>{const s=data.snippets.find(x=>x.id===activeSnippet);if(!s||!confirm('Delete this code snippet?'))return;data.snippets=data.snippets.filter(x=>x.id!==s.id);await save();activeSnippet=null;drawList();fill(null);toast('Snippet deleted');};
  $('#codeExportAll').onclick=()=>download(new Blob([JSON.stringify({format:'AdvancedNotesCodeLibrary',version:1,snippets:data.snippets},null,2)],{type:'application/json'}),'advanced-notes-code-library.json');
  $('#codeImportAll').onclick=()=>$('#codeImportFile').click();
  $('#codeImportFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(parsed.format!=='AdvancedNotesCodeLibrary'||!Array.isArray(parsed.snippets))throw Error('This is not a valid Advanced Notes code library export.');const incoming=parsed.snippets.filter(s=>s&&typeof s.title==='string'&&typeof s.code==='string'&&s.code.length<=2000000).map(s=>({...s,id:uid(),created:date(),updated:date(),tags:Array.isArray(s.tags)?s.tags.filter(t=>typeof t==='string').slice(0,30):[]}));if(!incoming.length)throw Error('No valid snippets found.');if(!confirm('Import '+incoming.length+' snippet(s)? Existing snippets will be kept.'))return;data.snippets.unshift(...incoming);await save();drawList();fill(null);toast(incoming.length+' snippets imported');}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};
  drawList();const first=selected?data.snippets.find(s=>s.id===selected):data.snippets[0];fill(first||null);
 }
 $('#codeLibraryNav').onclick=openLibrary;$('#codeLibraryBtn').onclick=openLibrary;
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='c'){e.preventDefault();openLibrary()}});
})();
</script>

</body></html>
