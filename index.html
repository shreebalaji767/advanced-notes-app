function load(){let v=JSON.parse(localStorage.getItem(keyName)||'null');if(!v)return;if(v.encrypted){encrypted=true;unlocked=false;$('#modal').innerHTML='<div class="modal"><form class="card" id="unlockForm"><h2>Unlock your notes</h2><p>Your notes are encrypted on this device.</p><input id="pass" type="password" placeholder="Workspace password" required><button class="primary">Unlock</button><p id="err" class="danger"></p></form></div>';$('#unlockForm').onsubmit=async e=>{e.preventDefault();try{let salt=un64(v.salt),k=await derive($('#pass').value,salt),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(v.iv)},k,un64(v.data));data=JSON.parse(new TextDecoder().decode(plain));cryptoKey=k;unlocked=true;$('#modal').innerHTML='';render();}catch(x){$('#err').textContent='Incorrect password or damaged vault.'}}}else data=JSON.parse(v.data||'{"notes":[],"folders":[]}')}
function sanitizeHtml(input){const doc=new DOMParser().parseFromString(String(input||''),'text/html');const allowed=new Set(['P','BR','DIV','SPAN','B','STRONG','I','EM','U','S','H1','H2','H3','H4','UL','OL','LI','BLOCKQUOTE','PRE','CODE','A','TABLE','THEAD','TBODY','TR','TH','TD','HR','INPUT']);const walk=node=>{[...node.childNodes].forEach(child=>{if(child.nodeType===1){if(!allowed.has(child.tagName)){child.replaceWith(...child.childNodes);return}for(const a of [...child.attributes]){const ok=(child.tagName==='A'&&a.name==='href'&&/^https?:\\/\\//i.test(a.value))||(child.tagName==='INPUT'&&a.name==='type'&&a.value==='checkbox');if(!ok)child.removeAttribute(a.name)}if(child.tagName==='INPUT'){child.disabled=true;child.setAttribute('aria-label','Checklist item')}walk(child)}else if(child.nodeType!==3)child.remove()})};walk(doc.body);return doc.body.innerHTML}

function render(){renderNav();let a=data.notes.filter(n=>{if(view==='trash')return n.deleted;if(n.deleted)return false;if(view==='archive')return n.archived;if(n.archived)return false;if(view==='favorites')return n.favorite;if(view==='pinned')return !!n.pinned;if(view==='due'){if(!n.due)return false;const limit=new Date(Date.now()+7*86400000).toISOString().slice(0,10);return n.due<=limit}if(view==='recent')return true;if(folderView)return n.folder===folderView;if(tagView)return(n.tags||[]).includes(tagView);return true});let q=$('#search').value.toLowerCase();if(q)a=a.filter(n=>(n.title+' '+text(n)+' '+(n.tags||[]).join(' ')).toLowerCase().includes(q));let sort=$('#sort').value;a.sort((x,y)=>sort==='title'?x.title.localeCompare(y.title):sort==='created'?y.created.localeCompare(x.created):y.updated.localeCompare(x.updated));$('#items').innerHTML=a.length?a.map(n=>'<button class="note '+(n.id===id?'active':'')+'" data-id="'+escape(n.id)+'"><div class="nt">'+escape(n.title||'Untitled note')+'</div><div class="preview">'+escape(text(n).slice(0,100)||'No additional text')+'</div><div class="meta">'+(n.favorite?'★ ':'')+escape((n.tags||[]).join(', '))+' · '+new Date(n.updated).toLocaleDateString()+'</div></button>').join(''):'<div class="empty">No notes here. Create a note or change your search.</div>';$('#listTitle').textContent=({all:'All notes',favorites:'Favorites',recent:'Recently edited',pinned:'Pinned notes',due:'Due soon',archive:'Archive',trash:'Recycle bin'}[view]||'Folder');$('#count').textContent=data.notes.filter(n=>!n.deleted).length+' notes';$('#storage').textContent=encrypted?'Encrypted on this device':'Stored on this device';renderEditor()}

function renderEditor(){let n=current();['#title','#rich','#md','#folder','#noteTags','#favorite','#archive','#delete','#restore','#markdown','#preview','#pin'].forEach(s=>$(s).disabled=!n);$('#restore').disabled=!n||!n.deleted;$('#pin').textContent=n&&n.pinned?'Unpin':'Pin';if(!n){$('#title').value='';$('#rich').innerHTML='';$('#md').value='';$('#noteTags').value='';$('#saved').textContent='Select or create a note';counts('');return}$('#title').value=n.title;$('#rich').innerHTML=sanitizeHtml(n.content||'');$('#md').value=n.markdown||'';$('#noteTags').value=(n.tags||[]).join(', ');$('#folder').value=n.folder||'';$('#favorite').textContent=n.favorite?'★':'☆';$('#archive').textContent=n.archived?'Unarchive':'Archive';$('#saved').textContent='Saved '+new Date(n.updated).toLocaleString();markdown=!!n.markdownMode;preview=false;sync();counts(text(n))}

function sync(){$('#rich').classList.toggle('hidden',markdown||preview);$('#md').style.display=markdown&&!preview?'block':'none';$('#previewPane').classList.toggle('hidden',!preview);$('#preview').textContent=preview?'Edit':'Preview'}
function mdHtml(s){return '<p>'+escape(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')+'</p>'}

async function saveNote(){let n=current();if(!n||!dirty)return;n.title=$('#title').value.trim()||'Untitled note';n.folder=$('#folder').value||'';n.tags=$('#noteTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20);if(markdown){n.markdown=$('#md').value;n.content=mdHtml(n.markdown);n.markdownMode=true}else{n.content=sanitizeHtml($('#rich').innerHTML);n.markdown='';n.markdownMode=false}n.updated=date();n.history=n.history||[];n.history.push({title:n.title,content:n.content,updated:n.updated});n.history=n.history.slice(-20);dirty=false;await save();render();$('#saved').textContent='Saved'}
function create(){let n={id:uid(),title:'',content:'',markdown:'',markdownMode:false,folder:folderView||'',tags:[],favorite:false,archived:false,deleted:false,created:date(),updated:date(),history:[]};data.notes.unshift(n);id=n.id;save().then(()=>{render();$('#title').focus()})}

$('#new').onclick=create;$('#folderAdd').onclick=()=>ask('New folder','Enter a folder name',async name=>{data.folders.push({id:uid(),name:name.slice(0,60),parentId:folderView||''});await save();render()});$('#folders').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-folder]');if(!b)return;e.preventDefault();const f=data.folders.find(x=>x.id===b.dataset.folder);if(!f)return;const action=prompt('Folder actions: child, rename, delete','child');if(action==='child'){const name=prompt('Name of subfolder');if(name){data.folders.push({id:uid(),name:name.slice(0,60),parentId:f.id});save().then(render)}}else if(action==='rename'){const name=prompt('New folder name',f.name);if(name){f.name=name.slice(0,60);save().then(render)}}else if(action==='delete'&&confirm('Delete this folder? Notes and subfolders will move to its parent.')){data.folders.forEach(x=>{if(x.parentId===f.id)x.parentId=f.parentId||''});data.notes.forEach(n=>{if(n.folder===f.id)n.folder=f.parentId||''});data.folders=data.folders.filter(x=>x.id!==f.id);if(folderView===f.id)folderView=f.parentId||'';save().then(render)}});$('#search').oninput=render;$('#sort').onchange=render;
$('#items').onclick=e=>{let b=e.target.closest('[data-id]');if(b){saveNote().then(()=>{id=b.dataset.id;render()})}};
$('.nav').onclick=e=>{let v=e.target.closest('[data-view]'),f=e.target.closest('[data-folder]'),t=e.target.closest('[data-tag]');if(v){view=v.dataset.view;folderView='';tagView='';id=null;$$('[data-view]').forEach(x=>x.classList.toggle('active',x===v));render()}if(f){folderView=f.dataset.folder;tagView='';view='all';id=null;render()}if(t){tagView=t.dataset.tag;folderView='';view='all';id=null;render()}};
$('#title').oninput=schedule;$('#rich').oninput=()=>{schedule();counts($('#rich').innerText)};$('#md').oninput=()=>{schedule();counts($('#md').value)};$('#folder').onchange=schedule;$('#noteTags').oninput=schedule;
$$('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('#rich').focus();schedule()});
$('#markdown').onclick=()=>{if(!current())return;if(!markdown)$('#md').value=toMd($('#rich').innerHTML);else $('#rich').innerHTML=mdHtml($('#md').value);markdown=!markdown;preview=false;sync();schedule()};
$('#preview').onclick=()=>{if(!current())return;if(!preview)$('#previewPane').innerHTML=sanitizeHtml(mdHtml(markdown?$('#md').value:toMd($('#rich').innerHTML)));preview=!preview;sync()};
$('#favorite').onclick=()=>{let n=current();if(n){n.favorite=!n.favorite;schedule();renderEditor()}};
$('#archive').onclick=()=>{let n=current();if(n){n.archived=!n.archived;schedule();render()}};
$('#restore').onclick=()=>{let n=current();if(!n||!n.deleted)return;n.deleted=false;n.updated=date();save().then(render);toast('Note restored')};$('#delete').onclick=()=>{let n=current();if(!n)return;if(n.deleted){if(confirm('Permanently delete this note?'))data.notes=data.notes.filter(x=>x!==n)}else n.deleted=true;id=null;save().then(render)};

$('#backup').onclick=backup;
$('#settings').onclick=()=>{let old=$('#modal');old.innerHTML='<div class="modal"><div class="card"><h2>Workspace settings</h2><p>Export or import your local notes, encrypt this workspace, or restore an earlier version.</p><button id="encrypt">Enable password encryption</button> <button id="export">Export note</button> <button id="history">Version history</button> <button id="import">Import backup</button> <button id="close">Close</button></div></div>';$('#close').onclick=()=>old.innerHTML='';$('#export').onclick=()=>{let n=current();if(n)download(new Blob([markdown?n.markdown:toMd(n.content)],{type:'text/markdown'}),(n.title||'note')+'.md')};$('#history').onclick=()=>{let n=current();if(!n||!n.history.length)return toast('No saved versions');ask('Restore version','Type the version number, newest first (1 = latest)',v=>{let h=n.history[n.history.length-Number(v)];if(h&&confirm('Restore this version?')){n.title=h.title;n.content=h.content;n.updated=date();save().then(render)}})};$('#import').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{let v=JSON.parse(await i.files[0].text());if(!confirm('Replace all current notes?'))return;if(v.format==='AdvancedNotesBackup'){localStorage.setItem(keyName,v.vault);if(v.salt)localStorage.setItem(keyName+'_salt',v.salt)}else localStorage.setItem(keyName,JSON.stringify(v));location.reload()}catch(e){toast('Invalid backup file')}};i.click()};$('#encrypt').onclick=()=>{if(encrypted)return toast('Encryption already enabled');ask('Set workspace password','Use at least 8 characters. Keep it safe; it cannot be recovered.',async pass=>{if(pass.length<8)return toast('Use at least 8 characters');let salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await derive(pass,salt);localStorage.setItem(keyName+'_salt',b64(salt));encrypted=true;await save();toast('Encryption enabled')})}};
$('#lock').onclick=async()=>{if(!encrypted)return toast('Enable encryption in Settings first');await saveNote();cryptoKey=null;data={notes:[],folders:[]};unlocked=false;location.reload()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNote()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
try{load();if(unlocked)render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){toast('Could not open notes: '+e.message)}
</script>
<script>
(()=>{
const oldRenderEditor=renderEditor;
renderEditor=function(){oldRenderEditor();const n=current();$('#dueDate').value=n&&n.due||'';$('#duplicate').disabled=!n;$('#print').disabled=!n;};
const oldSchedule=schedule;
schedule=function(){const n=current();if(n)n.due=$('#dueDate').value;oldSchedule();};
$('#dueDate').addEventListener('change',schedule);
$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('advanced-notes-theme',document.body.classList.contains('dark')?'dark':'light');$('#theme').textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode';};
if(localStorage.getItem('advanced-notes-theme')==='dark'){document.body.classList.add('dark');$('#theme').textContent='Light mode';}
$('#heading').onclick=()=>{if(!current())return;document.execCommand('formatBlock',false,'h2');$('#rich').focus();schedule();};
$('#code').onclick=()=>{if(!current())return;document.execCommand('formatBlock',false,'pre');$('#rich').focus();schedule();};
$('#checklist').onclick=()=>{if(!current())return;const ul=document.createElement('ul');ul.dataset.taskList='';for(let i=0;i<3;i++){const li=document.createElement('li');const cb=document.createElement('input');cb.type='checkbox';li.append(cb,document.createTextNode('Task '+(i+1)));ul.append(li)}$('#rich').append(ul);schedule();};
$('#table').onclick=()=>{if(!current())return;const t=document.createElement('table');t.innerHTML='<tbody><tr><th>Column 1</th><th>Column 2</th></tr><tr><td> </td><td> </td></tr><tr><td> </td><td> </td></tr></tbody>';$('#rich').append(t);schedule();};
$('#pin').onclick=()=>{const n=current();if(!n)return;n.pinned=!n.pinned;n.updated=date();save().then(render);$('#pin').textContent=n.pinned?'Unpin':'Pin'};$('#duplicate').onclick=async()=>{const n=current();if(!n)return;await saveNote();const copy=JSON.parse(JSON.stringify(n));copy.id=uid();copy.title=(n.title||'Untitled note')+' (copy)';copy.created=date();copy.updated=copy.created;copy.favorite=false;copy.archived=false;copy.deleted=false;data.notes.unshift(copy);id=copy.id;await save();render();toast('Note duplicated');};
$('#print').onclick=()=>{const n=current();if(!n)return;const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');w.document.write('<!doctype html><meta charset="utf-8"><title>'+escape(n.title)+'</title><h1>'+escape(n.title)+'</h1>'+sanitizeHtml(n.content));w.document.close();w.print();};
$('#daily').onclick=async()=>{const d=new Date().toISOString().slice(0,10);let n=data.notes.find(x=>x.dailyDate===d&&!x.deleted);if(!n){n={id:uid(),title:'Daily journal — '+d,content:'<h2>Today</h2><p></p><h2>Priorities</h2><ul><li></li></ul><h2>Notes</h2><p></p><h2>Gratitude</h2><p></p>',markdown:'',markdownMode:false,folder:'',tags:['journal'],favorite:false,archived:false,deleted:false,created:date(),updated:date(),history:[],dailyDate:d};data.notes.unshift(n);await save()}id=n.id;view='all';folderView='';tagView='';render();$('#title').focus();};
const renderBase=render;
render=function(){renderBase();const items=$('#items');const buttons=[...items.querySelectorAll('.note')];buttons.forEach(b=>{const n=data.notes.find(x=>x.id===b.dataset.id);if(!n)return;const flags=[];if(n.due)flags.push('Due '+n.due);if(n.pinned)flags.push('📌');if(n.dailyDate)flags.push('Journal');if(flags.length){const m=document.createElement('div');m.className='meta';m.textContent=flags.join(' · ');b.append(m)}});buttons.sort((a,b)=>Number(!!data.notes.find(n=>n.id===b.dataset.id)?.pinned)-Number(!!data.notes.find(n=>n.id===a.dataset.id)?.pinned));buttons.forEach(x=>items.append(x));};
$('#items').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-id]');if(!b)return;e.preventDefault();const n=data.notes.find(x=>x.id===b.dataset.id);if(!n)return;const action=prompt('Note actions: type pin, unpin, or delete','pin');if(action==='pin'||action==='unpin'){n.pinned=action==='pin';n.updated=date();save().then(render)}else if(action==='delete'){n.deleted=true;save().then(render)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();$('#daily').click()}});
})();
</script>
</body></html>
